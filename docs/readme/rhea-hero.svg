<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="t d"><title id="t">Rhea Project — proof before birth</title><desc id="d">A bright eight-stage state-transition mandala inspired by the Greek Titaness Rhea, showing proof gates around a central state seed.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4dd"/><stop offset=".44" stop-color="#fff"/><stop offset="1" stop-color="#dbe6ff"/></linearGradient></defs><rect width="1600" height="760" rx="42" fill="url(#bg)"/><g transform="translate(1160 380)" fill="none"><circle r="286" stroke="#102446" stroke-width="5"/><circle r="238" stroke="#ff4e68" stroke-width="20" stroke-dasharray="12 42"/><circle r="190" stroke="#1d78ff" stroke-width="15" stroke-dasharray="70 18"/><circle r="140" stroke="#10b7aa" stroke-width="12"/><circle r="84" fill="#ffe66d" stroke="#102446" stroke-width="6"/></g><g fill="#102446" font-family="ui-monospace,monospace" font-size="17" font-weight="900"><text x="1126" y="55">01 CONTRACT</text><text x="1377" y="142">02 VALIDATE</text><text x="1470" y="360">03 STORE</text><text x="1390" y="610">04 HOST</text><text x="1125" y="719">05 PLAY</text><text x="873" y="612">06 ADVISE</text><text x="785" y="360">07 EXECUTE</text><text x="870" y="140">08 BRIDGE</text></g><path d="M1120 352h80l-40-58Z" fill="#ff4e68"/><g font-family="system-ui,Segoe UI,sans-serif" fill="#102446"><text x="78" y="110" font-size="34" font-weight="800" letter-spacing="5">RHEA / ῬΕΑ</text><text x="78" y="215" font-size="94" font-weight="950">PROOF BEFORE</text><text x="78" y="305" font-size="94" font-weight="950">BIRTH.</text><text x="82" y="392" font-size="28" font-weight="800">A distributed system should not be allowed to invent its own past.</text><text x="82" y="454" font-size="22">proposal → admission → evidence → owned transition → receipt</text><text x="82" y="535" font-size="20" font-weight="900" fill="#ff365b">ACTIVE V2 WORKSTREAM: DESIGN_ONLY.</text><text x="82" y="574" font-size="20">Stage 01 contracts only. No gate becomes PASS because a model says so.</text><text x="82" y="646" font-size="19">Rhea saved succession from Cronus with substitution and concealment. This project saves state from ambiguity with explicit authority and evidence.</text></g></svg>